<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview — Install Banner Android</title>
<style>
  body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;}
  :root{--font-head:'Arial Black',Arial,sans-serif;--accent:#0ba6b3;--surface:#0d2535;--surface2:#122e40;--text:#e8f5f8;--text2:#6ab5c8;}

  /* Phone frame */
  .phone{width:375px;height:720px;background:#1a2a36;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,0.8);border:6px solid #222;}
  .phone-screen{width:100%;height:100%;background:linear-gradient(180deg,#071820 0%,#0d2535 100%);position:relative;overflow:hidden;}
  .phone-notch{width:120px;height:28px;background:#111;border-radius:0 0 18px 18px;margin:0 auto;position:relative;z-index:10;}
  .map-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 40% 50%,#0d3a2a 0%,#071820 70%);opacity:0.8;}
  /* fake map tiles */
  .map-bg::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,0.03) 0,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 60px),repeating-linear-gradient(90deg,rgba(255,255,255,0.03) 0,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 60px);}
  .map-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#0ba6b3;box-shadow:0 0 8px #0ba6b3;}

  /* INSTALL BANNER — copie exacte du CSS de l'app */
  #install-banner{display:flex;position:absolute;bottom:0;left:0;right:0;z-index:9000;background:var(--surface);border-radius:20px 20px 0 0;overflow:hidden;flex-direction:column;box-shadow:0 -6px 32px rgba(0,0,0,0.5);}
  .ib-hero{background:linear-gradient(135deg,#0ba6b3 0%,#0480b3 100%);padding:16px 16px 14px;display:flex;align-items:center;gap:14px;}
  .ib-hero-icon{width:54px;height:54px;border-radius:14px;overflow:hidden;flex-shrink:0;}
  .ib-hero-icon img{width:100%;height:100%;display:block;}
  .ib-hero-text{flex:1;min-width:0;}
  .ib-hero-name{color:#fff;line-height:1.1;}
  .ib-hero-name .ib-label{display:block;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;opacity:0.75;margin-bottom:2px;}
  .ib-hero-name .ib-appname{display:block;font-family:var(--font-head);font-size:26px;font-weight:900;letter-spacing:1px;}
  .ib-hero-tag{font-size:11px;color:rgba(255,255,255,0.72);margin-top:5px;letter-spacing:0.2px;}
  .ib-close{background:rgba(255,255,255,0.2);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ib-body{padding:14px 16px 22px;display:flex;flex-direction:column;gap:10px;}
  .ib-btn{width:100%;background:linear-gradient(135deg,#0ba6b3,#0480b3);color:#fff;border:none;border-radius:12px;padding:14px;font-family:var(--font-head);font-size:15px;font-weight:800;cursor:pointer;letter-spacing:0.3px;box-sizing:border-box;}
</style>
</head>
<body>
<div class="phone">
  <div class="phone-screen">
    <div class="phone-notch"></div>
    <div class="map-bg"></div>
    <div class="map-dot" style="top:180px;left:120px"></div>
    <div class="map-dot" style="top:260px;left:200px;background:#22d3a0;box-shadow:0 0 8px #22d3a0"></div>
    <div class="map-dot" style="top:320px;left:80px"></div>
    <div class="map-dot" style="top:150px;left:260px;background:#f59e0b;box-shadow:0 0 8px #f59e0b"></div>

    <!-- ANDROID BANNER -->
    <div id="install-banner">
      <div class="ib-hero">
        <div class="ib-hero-icon"><img src="icon-192.png" alt="ANY" onerror="this.style.cssText='width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0ba6b3;font-size:22px;'; this.outerHTML='<div style=\'width:54px;height:54px;background:linear-gradient(135deg,#0ba6b3,#0480b3);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;\'>📍</div>'"></div>
        <div class="ib-hero-text">
          <div class="ib-hero-name">
            <span class="ib-label">Installer</span>
            <span class="ib-appname">ANY</span>
          </div>
          <div class="ib-hero-tag">Gratuit &middot; Acc&egrave;s rapide &middot; Fonctionne hors ligne</div>
        </div>
        <button class="ib-close">&#10005;</button>
      </div>
      <div class="ib-body">
        <button class="ib-btn">&#11015; Ajouter &agrave; l&rsquo;&eacute;cran d&rsquo;accueil &mdash; Gratuit</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
